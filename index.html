<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="./codeBreaker.png" type="image/png">
    <link rel="apple-touch-icon" href="./codeBreaker.png">
    <link rel="mask-icon" href="./codeBreaker.png " color="black">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
    <title>codeBreaker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="splash">
        <img src="codeBreaker.png" alt="Loading...">
    </div>
    <div id="page" style="display:none;">
        <div id="outerDiv">
            <div id="titleDiv">codeBreaker</div>
            <div id="guessDiv">
                <input class="digitInput" maxlength="1" inputmode="numeric">
                <input class="digitInput" maxlength="1" inputmode="numeric">
                <input class="digitInput" maxlength="1" inputmode="numeric">
                <input class="digitInput" maxlength="1" inputmode="numeric">

                <button id="submitGuess">SUBMIT</button>
            </div>
            <div id="cluesDiv"></div>
            <div id="messageDiv"></div>
            <button id="playAgainButton" style="display: none;">PLAY AGAIN</button>
        </div>
    </div>
    <script src="./scripts.js"></script>
</body>
</html>
