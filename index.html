<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">    
    <link rel="icon" href="./codeBreaker.png" type="image/png">
    <link rel="apple-touch-icon" href="./codeBreaker.png">
    <link rel="mask-icon" href="./codeBreaker.png " color="black">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
    <title>codeBreaker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="splash">
        <img src="codeBreaker.png" alt="Loading...">
    </div>
    <div id="page" style="display:none;">
        <div id="outerDiv">
            <div id="titleDiv">codeBreaker</div>
            <div id="guessDiv"></div>
            <div id="topButtons">
                <button id="practiceButton" style="display: none;">PRACTICE</button>
                <button id="challengeButton" style="display: none;">CHALLENGE</button>
                <button id="howToPlayButton" style="display: none;">HOW TO PLAY</button>
                <button id="fourDigitButton" style="display: none;">4 Digits</button>
                <button id="fiveDigitButton" style="display: none;">5 Digits</button>
                <button id="sixDigitButton" style="display: none;">6 Digits</button>
            </div>
            <div id="cluesDiv"></div>
            <div id="buttonDiv">
                <button id="revealCodeButton" style="display: none;">REVEAL CODE</button>
                <button id="submitGuessButton" style="display: none;">SUBMIT GUESS</button>
                <button id="resetButton" style="display: none;">HOME</button>
                <button id="playAgainButton" style="display: none;">PLAY AGAIN</button>
            </div>
            <div id="messageDiv"></div>

        </div>
    </div>
    <script src="./clues.js"></script>
    <script src="./scripts.js"></script>
</body>
</html>
